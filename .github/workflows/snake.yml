name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=black
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=white

      # snk 生成的文件可能没有当前用户的写权限
      - name: Make SVG files writable
        run: |
          sudo chmod -R a+rwX dist

      # 裁掉 SVG 底部的进度条
      - name: Remove progress bar
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for file in files:
              text = file.read_text(encoding="utf-8")

              match = re.search(
                  r'viewBox="([\d.\-]+)\s+([\d.\-]+)\s+([\d.\-]+)\s+([\d.\-]+)"',
                  text
              )

              if not match:
                  print(f"No viewBox found: {file}")
                  continue

              x, y, width, height = map(float, match.groups())

              # 缩短画布高度，裁掉下方进度条
              new_height = height * 0.78

              text = text.replace(
                  match.group(0),
                  f'viewBox="{x:g} {y:g} {width:g} {new_height:g}"',
                  1
              )

              # 同步调整 SVG 的 height
              text = re.sub(
                  r'(<svg\b[^>]*\bheight=")[^"]+(")',
                  lambda m: m.group(1) + f"{new_height:g}" + m.group(2),
                  text,
                  count=1
              )

              file.write_text(text, encoding="utf-8")

              print(
                  f"Cropped {file}: "
                  f"{height:g} -> {new_height:g}"
              )

          PY

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
